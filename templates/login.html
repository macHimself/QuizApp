{% extends "base.html" %}

{% block content %}

<h1>Přihlášení</h1>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    {% for message in messages %}
      <div class="flash-message">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}

<div class="login-container">

  <div class="login-box">
    <h2>Přihlásit se</h2>

    <form method="post">
      <input type="hidden" name="action" value="login">

      <label>Uživatelské jméno</label>
      <input type="text" name="username" required>

      <label>Heslo</label>
      <input type="password" name="password" required>

      <button type="submit">Přihlásit</button>
    </form>
  </div>

  <div class="login-box">
    <h2>Vytvořit účet</h2>

    <form method="post">
      <input type="hidden" name="action" value="register">

      <label>Uživatelské jméno</label>
      <input type="text" name="username" required>

      <label>Heslo</label>
      <input type="password" name="password" required>

      <button type="submit">Vytvořit účet</button>
    </form>
  </div>

</div>

<style>
.login-container {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    margin-top: 30px;
}

.login-box {
    flex: 1;
    min-width: 280px;
    background: #f8f9fa;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #ddd;
}

.login-box h2 {
    margin-top: 0;
}

.login-box form {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.login-box input {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #bbb;
}

.login-box button {
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #2e7d32;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.login-box button:hover {
    background: #1b5e20;
}

.flash-message {
    background: #fff3cd;
    border: 1px solid #ffeeba;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 15px;
}
</style>

{% endblock %}
